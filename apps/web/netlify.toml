# TS-73: how Netlify builds and serves the Seatwise web app.
#
# This is a pnpm workspace: the web app lives in apps/web but depends on packages/db and
# packages/shared, so Netlify installs and builds from the repository root. In the Netlify UI,
# leave "Base directory" empty and set "Package directory" to apps/web -- that's where Netlify
# looks for this file. Netlify detects Next.js and applies its OpenNext adapter automatically
# (Next.js 13.5+ is supported); nothing here needs to name the adapter.
#
# Secrets (DATABASE_URL, JWT_SECRET, ENCRYPTION_KEY, RESEND_API_KEY, ...) are set in the Netlify
# UI, never in this file -- see TS-71.

[build]
  # Paths are relative to the base directory (the repository root).
  command = "pnpm build"
  publish = "apps/web/.next"

  # Credits: every production deploy costs 15 of the free plan's 300 a month. Skip the build
  # (exit 0 = skip) when nothing the web app is built from changed -- e.g. a commit that only
  # touches tests, the mobile app, docs or CI. $CACHED_COMMIT_REF is the last built commit
  # (Netlify's build cache, not necessarily what's live).
  # TS-176: .npmrc and .nvmrc change how it installs and builds too.
  # TS-183: when the cached commit IS this commit (a "Retry deploy", "Clear cache and deploy", or a
  # deploy after an environment-variable change) the diff is empty and the build used to be
  # skipped -- so a new secret never reached the site. Same commit = always build (exit 1).
  # TS-192: with no cached commit (first build, or after the cache was cleared) there is nothing to
  # compare against, so always build -- an empty ref used to make the diff compare the wrong thing.
  # Variables are quoted so an empty or odd value can't change the command.
  ignore = "[ -z \"$CACHED_COMMIT_REF\" ] && exit 1; [ \"$CACHED_COMMIT_REF\" = \"$COMMIT_REF\" ] && exit 1; git diff --quiet \"$CACHED_COMMIT_REF\" \"$COMMIT_REF\" -- apps/web packages package.json pnpm-lock.yaml pnpm-workspace.yaml .npmrc .nvmrc"

[build.environment]
  # Same major version CI builds and tests with (.github/workflows/ci.yml), and .nvmrc.
  NODE_VERSION = "22"
  # Build without Next.js telemetry.
  NEXT_TELEMETRY_DISABLED = "1"
