# Requirements source of truth (Playwright Quality Engineering Framework, Stage 02).
# Validated against playwright-framework/metadata/schemas.ts:RequirementsFileSchema.
#
# Per PLAYWRIGHT_QUALITY_FRAMEWORK_SPEC.md's Project Profile: no formal requirements document
# exists for Seatwise today. README.md's "What's implemented" section is the closest thing to a
# living feature list, so every entry below with provenance "seeded from README.md" is a literal
# feature-area title and ticket/FR reference copied from that section -- nothing here is invented.
# All such entries start life at status "needs-human-review": a human (Tom) must confirm, correct,
# reprioritize, or split each one before it should be treated as an authoritative acceptance
# requirement. The two entries with status "placeholder" are explicitly fake examples showing the
# shape of a fully-specified requirement -- they do not describe anything in the app and must never
# be matched by a real test's requirementIds.

