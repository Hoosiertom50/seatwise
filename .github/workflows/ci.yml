# Stage 10 -- Playwright Quality Engineering Framework CI gate.
#
# TS-215: every job runs on ubuntu-24.04, not ubuntu-latest -- ubuntu-latest moves to a new Ubuntu
# release on GitHub's schedule, and the jobs that install browsers on the runner itself could break
# the day it does. Move to a newer image on purpose, in its own change. Actions are pinned by full
# commit SHA (the comment names the release); each SHA was checked against the release tag.
#
# Jobs, deliberately separated so a typecheck/lint/metadata problem fails fast without ever
# spinning up Postgres or a browser:
#   1. validate  -- typecheck, metadata validation, lint, and the framework's own unit tests
#      (playwright-framework/tests/**), run through `playwright test --project=framework-unit` (see
#      playwright.config.ts). No database here. Almost no browser either: nearly all of these are
#      plain TypeScript/Node checks, but a handful (maintenanceReportHtml.spec.ts,
#      suiteReviewHtml.spec.ts, runReportHtml.spec.ts) launch a real Chromium directly via
#      `chromium.launch()` in `test.beforeAll` to verify generated HTML reports render against a
#      real DOM with no runtime errors -- this project's "verify with real checks" standard applied
#      to its own tooling output. TS-56 found this job failing on every run because of it (this
#      comment previously claimed "no browser" outright): a bare `ubuntu-24.04` runner has no
#      Chromium cached, so `chromium.launch()` threw `Executable doesn't exist`. Fixed by installing
#      Chromium here too, same as the e2e job below.
#   2. e2e        -- the real application end-to-end suite (e2e/tests/**) against a real Postgres
#      service container and a real built-and-started Next.js app, sharded across 2 shards to
#      exercise Playwright.config.ts's CI-only retries/workers/timeout settings and the sharding
#      mechanism this stage adds (see PLAYWRIGHT_TESTING.md's "CI, sharding, and report merging"
#      section for why 2 shards is a deliberately modest default given the current 2-test suite,
#      and how to raise it as the suite grows).
#   3. mobile-unit-tests -- TS-59: apps/mobile's own Jest suite (src/planMerge.ts and
#      src/offline/queue.ts coverage -- 15 plain-TypeScript tests, no React Native/device
#      dependency) had a real, verified gap where nothing in CI ever ran it: playwright.config.ts
#      deliberately excludes apps/mobile/__tests__ (it's Jest, not Playwright), and no other
#      workflow or script called into it either, so these two files could regress silently. This
#      job closes that gap. Deliberately independent of validate/e2e (no `needs:`, nothing needs
#      it) since it shares no dependency with either -- it runs in parallel for fast feedback, no
#      Postgres or browser required. Per TS-59's own recorded decisions: blocking (this job's status
#      must pass, same expectation as validate/e2e -- add it to the repo's required-status-checks
#      branch protection rule if that isn't automatic), PR/push gate only (not added to
#      scheduled-regression.yml or weekly-quality-review.yml -- a small, stable, dependency-free
#      unit suite has no reason to newly fail between pushes the way a flaky browser-driven e2e test
#      might).
#   3b. web-unit-tests -- TS-94: apps/web's own Node unit tests (`pnpm --filter @seatwise/web
#      test` -- src/**/*.test.mts, currently the session-renewal policy and token claims in
#      lib/session-renewal.ts and lib/auth.ts). Same shape and reasoning as mobile-unit-tests:
#      no Postgres, browser or real JWT_SECRET (the tests set a throwaway one), independent of
#      every other job, blocking, PR/push only. None of the e2e jobs can reach this logic -- aging
#      a token needs the server's signing secret -- so without this job it could regress silently.
#   4. e2e-firefox -- TS-61: adds Firefox as a second browser in the real, blocking CI gate,
#      following TS-60's throwaway spike (branch ts60-cross-browser-spike, draft PR #10, GitHub
#      Actions run #18, plus 2 additional manual re-runs of just the firefox job) which showed 3
#      consecutive clean passes of the full regression selection against Firefox on real
#      ubuntu-latest runners (~4 minutes each, no failures, no flaky retries). WebKit, run in the
#      same spike, showed a systemic tab-navigation timeout/detach pattern and is deliberately NOT
#      added here -- see TS-62 for that investigation. This job mirrors the e2e (chromium) job's
#      structure exactly (same Postgres service, same build+start+sharded-run steps) but targets
#      --project=firefox; it is deliberately independent (no needs: on e2e, and nothing in e2e
#      needs it) so it can never affect the existing chromium job's own status or required-check
#      name. Partially supersedes DEC-003 (PLAYWRIGHT_QUALITY_FRAMEWORK_SPEC.md's Decision Log,
#      see DEC-035) -- WebKit was deferred per that same decision, then added in its own right below
#      (item 5) once TS-62 found and fixed its real root cause (see DEC-036).
#   5. e2e-webkit -- TS-62: adds WebKit as a third browser in the real, blocking CI gate. TS-60's
#      original spike found a systemic WebKit-only failure pattern (13 failures, all tab-navigation
#      timeouts). TS-62 found the real cause: the auth cookie's `secure` flag was tied to
#      NODE_ENV==="production" (true for this job's own `next build && next start`) while the app is
#      served over plain http://localhost:3000 in CI -- a Secure cookie over HTTP that Chromium and
#      Firefox both silently tolerate on localhost but that WebKit does not, dropping the cookie and
#      401ing every request after it (see lib/auth.ts's own isSecureCookieContext doc comment). Fixed
#      there, then soak-tested on a throwaway spike branch (ts62-webkit-settle-spike) at increasing
#      rigor: a targeted 15-spec run (GH Actions run #22, clean, alongside a clean e2e and
#      e2e-firefox on the same commit), then the SAME full regression selection e2e/e2e-firefox run,
#      sharded the same way -- 1 automatic run plus 3 manual re-runs of each shard, all clean, no
#      flaky retries (see DEC-036). This job mirrors e2e-firefox's structure exactly but targets
#      --project=webkit; unlike the spike it lived on, it DOES feed merge-reports (see that job's
#      updated needs: below), the same as e2e and e2e-firefox.
#   6. e2e-edge -- TS-64: adds Microsoft Edge as a fourth browser in the real, blocking CI gate.
#      Unlike Firefox/WebKit, Edge is not a separate rendering engine -- Playwright runs it via a
#      "channel" on top of the same Chromium engine the e2e (chromium) job already has months of
#      clean CI history on (see the "edge" project in playwright.config.ts, channel: "msedge").
#      ubuntu-24.04 ships Edge preinstalled, so this needs no new browser-binary download the way
#      Firefox/WebKit did -- just registering the channel with Playwright. Validated on a throwaway
#      spike (TS-63, branch ts63-edge-validation-spike, PR #14): one unsharded full-regression run
#      against real Edge, clean, alongside clean e2e/e2e-firefox/e2e-webkit runs on the same commit.
#      No Firefox-style multi-run soak test was needed here -- same engine already proven out in the
#      real gate, and TS-63's own scope deliberately didn't call for that rigor. This job mirrors
#      e2e-firefox's structure exactly but targets --project=edge; it DOES feed merge-reports (see
#      that job's updated needs: below), the same as e2e/e2e-firefox/e2e-webkit. Fully supersedes
#      DEC-003 for Edge (see DEC-037) -- all four browsers (chromium, firefox, webkit, edge) are now
#      in the real, required gate.
#
# Every command below is one this repo's own documented `pnpm pw:*` scripts already run locally --
# nothing here invents a CI-only code path. `playwright-framework/cli/ci-summary.ts` is the one
# CI-specific addition: a real, verified gap (documented in its own file header and in
# PLAYWRIGHT_TESTING.md) where `playwright test` exits 0 for a zero-match `--grep` or an empty
# shard, which would otherwise show up on a PR as an ordinary green check.
name: Playwright Quality Engineering Framework CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# TS-149: these jobs only read the code and upload artifacts.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # TS-132: CI never sends real email -- it's printed instead, and the app treats that as sent.
  EMAIL_TRANSPORT: log
  # TS-148: the tests set up collaborators directly; the live site never allows that.
  ALLOW_DIRECT_COLLABORATOR_ADD: "1"
  # No secret here: an ephemeral, CI-job-lifetime-only Postgres database that never holds anything
  # but throwaway test data, matching this framework's own e2e/support/env.ts default APP_URL and
  # the .env.example DATABASE_URL shape.
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/seatwise_ci?schema=public
  # PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH is intentionally left UNSET here -- see playwright.config.ts's
  # own comment: it's a sandbox-only workaround for this development environment's pre-installed
  # Chromium build. A real CI runner installs its own browser via `playwright install` below, and
  # Playwright's default resolution finds it without this variable.

jobs:
  validate:
    name: Typecheck, metadata validation, lint, framework unit tests
    runs-on: ubuntu-24.04
    # TS-139: run inside Playwright's official image, pinned to the same version as
    # @playwright/test. Its browsers and every OS library they need are already installed, so the job
    # no longer spends 10-20 minutes on `playwright install --with-deps` downloading ~150 packages
    # from Ubuntu's mirrors whenever those are slow. Keep the tag in step with package.json.
    # --user 1001 is the runner's own uid (Playwright's documented setting for GitHub Actions, so the
    # checked-out workspace stays writable and Firefox doesn't refuse to run as root).
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001 --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (framework + e2e sources)
        run: pnpm exec tsc --noEmit

      - name: Validate governed metadata (requirements, tags, value model, test IDs)
        run: pnpm pw:validate-metadata

      - name: Lint tests (authoring-standards static checks)
        run: pnpm pw:lint-tests

      # TS-176: the root typecheck above covers the framework and e2e sources only, and the web
      # build doesn't run eslint -- so the web app's lint, and the mobile app and packages
      # (including the database maintenance scripts), were never checked.
      - name: Lint the web app
        run: pnpm --filter @seatwise/web lint

      - name: Typecheck the mobile app and shared/db packages
        run: |
          pnpm --filter @seatwise/mobile exec tsc --noEmit -p .
          pnpm --filter @seatwise/shared exec tsc --noEmit -p .
          pnpm --filter @seatwise/db exec tsc --noEmit -p .

      # TS-215: plus the e2e helpers' own unit tests (e2e/tests/unit: the tab-order rules, token
      # redaction, test-address ids, artifact paths). They carry no @suite tag, so the tag-selected
      # e2e jobs never ran them; the `unit` project needs no database or app.
      - name: Run framework unit tests (schemas, scoring, hooks, CLIs, and a few real-browser HTML-report render checks) and e2e helper unit tests
        run: pnpm exec playwright test --project=framework-unit --project=unit

  mobile-unit-tests:
    name: Mobile app unit tests (apps/mobile)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run apps/mobile's Jest suite (planMerge, offline queue -- no simulator/device needed)
        run: pnpm --filter @seatwise/mobile test

  web-unit-tests:
    name: Web app unit tests (apps/web)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run apps/web's unit tests (session-renewal policy -- no database/browser needed)
        run: pnpm --filter @seatwise/web test

  e2e:
    name: "Application E2E (shard ${{ matrix.shard }}/2)"
    runs-on: ubuntu-24.04
    # TS-245: a stuck job (a browser install once hung for 2 hours) is stopped after 30 minutes.
    timeout-minutes: 30
    # TS-139: run inside Playwright's official image, pinned to the same version as
    # @playwright/test. Its browsers and every OS library they need are already installed, so the job
    # no longer spends 10-20 minutes on `playwright install --with-deps` downloading ~150 packages
    # from Ubuntu's mirrors whenever those are slow. Keep the tag in step with package.json.
    # --user 1001 is the runner's own uid (Playwright's documented setting for GitHub Actions, so the
    # checked-out workspace stays writable and Firefox doesn't refuse to run as root).
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001 --ipc=host
    # Inside a container job the Postgres service is reached by its service name, not localhost.
    env:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/seatwise_ci?schema=public
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: seatwise_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate ephemeral, non-secret app config for this CI run only
        # These gate a throwaway CI-only Postgres database and app instance that stops existing the
        # moment this job ends -- never a real credential, so generating them fresh per run (rather
        # than storing a long-lived repository secret nothing actually needs to persist) is the
        # narrower-scoped choice. Written to GITHUB_ENV, never echoed to the log; see
        # PLAYWRIGHT_TESTING.md's "CI secrets and scoping" section for the full rationale.
        # TS-200: each value is masked before it's saved, so it never shows in the log even if a
        # later step prints it.
        run: |
          jwt_secret="$(node -e "process.stdout.write(require('crypto').randomBytes(32).toString('hex'))")"
          echo "::add-mask::$jwt_secret"
          echo "JWT_SECRET=$jwt_secret" >> "$GITHUB_ENV"
          encryption_key="$(node -e "process.stdout.write(require('crypto').randomBytes(32).toString('hex'))")"
          echo "::add-mask::$encryption_key"
          echo "ENCRYPTION_KEY=$encryption_key" >> "$GITHUB_ENV"

      - name: Apply database migrations
        run: pnpm --filter @seatwise/db migrate:deploy

      # TS-183: schema.prisma vs the migrations folder, replayed into a throwaway shadow database on
      # this job's Postgres service (the validate job has no database). Shard 1 only -- one check is
      # enough. The partial index plan_versions_one_current_per_wedding is the one allowed
      # difference (see packages/db/prisma/check-schema-drift.ts).
      # TS-192: it ran report-only (continue-on-error) until the first runs could be reviewed; they
      # reported no drift, so it now blocks -- a schema change without its migration (or the other
      # way round) fails CI instead of reaching production.
      - name: Schema drift check (schema.prisma vs migrations)
        if: matrix.shard == 1
        env:
          SHADOW_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/seatwise_shadow
        run: pnpm --filter @seatwise/db check-schema-drift

      - name: Build the application
        run: pnpm build

      - name: Start the application and wait for it to be ready
        # TS-139: the server's output goes to a file. Started in the background, its stdout is a pipe
        # nobody reads once this step ends; inside a container job that pipe filled after ~20 tests
        # and every log write -- and so every request -- blocked forever.
        run: |
          pnpm --filter @seatwise/web start -p 3000 > "$RUNNER_TEMP/next-server.log" 2>&1 &
          # TS-172: a plain retry loop instead of downloading an unpinned npm package on every run.
          node -e "const end=Date.now()+60000;(async function wait(){try{const r=await fetch('http://localhost:3000');if(r.ok)return;}catch{}if(Date.now()>end){console.error('server did not start');process.exit(1)}setTimeout(wait,1000)})()"

      - name: Run the application E2E suite (this shard, regression selection minus quarantined)
        # pnpm pw:run (Stage 05) has no --shard support and its --reporter forwards a single
        # Playwright-native reporter name that REPLACES the whole configured array (Stage 06's own
        # disclosed finding) -- using it here would silence the Stage 06/09 normalized reporter
        # ci-summary.ts depends on. Instead, print-ci-selection.ts (Stage 10) computes the exact
        # same --grep pattern and matched spec files pw:run itself would use (reusing the same
        # evaluateExpression/compileToGrepPattern primitives, so this can never drift from what
        # `pnpm pw:run --selection regression --list` shows), and this step invokes `playwright
        # test` directly with that plus --shard and a real multi-reporter list. This intentionally
        # bypasses pw:run's own production/mutation preflight -- an accepted, disclosed limitation
        # for CI specifically (DEC-018 already discloses this same bypass for any bare `playwright
        # test --grep` invocation): PRODUCTION_HOSTNAMES is always empty here (DEC-005), so that
        # guard would be a no-op regardless. See PLAYWRIGHT_TESTING.md's "CI, sharding, and report
        # merging" section for the full rationale.
        env:
          CI: "true"
        run: |
          SELECTION_OUTPUT="$(pnpm exec tsx playwright-framework/cli/print-ci-selection.ts regression)"
          PATTERN="$(echo "$SELECTION_OUTPUT" | sed -n '1p')"
          FILES="$(echo "$SELECTION_OUTPUT" | sed -n '2p')"
          pnpm exec playwright test --project=chromium --grep "$PATTERN" $FILES \
            --shard=${{ matrix.shard }}/2 \
            --reporter=blob,./playwright-framework/reporting/normalizedReporter.ts

      - name: Show the end of the app server's log
        if: always()
        run: tail -n 200 "$RUNNER_TEMP/next-server.log" || true

      - name: CI status gate -- fail on a zero-test shard, surface flaky/quarantined results
        # Runs even when the step above failed (a real test failure must still get a summary), but
        # never overrides a real failure's own non-zero exit code -- see the CLI's own doc comment.
        if: always()
        # TS-176: a test that only passed on its retry fails the check (it's shown, not hidden).
        env:
          FAIL_ON_FLAKY: "1"
        run: pnpm exec tsx playwright-framework/cli/ci-summary.ts

      - name: Upload blob report (for merging into one combined HTML report)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-report-shard-${{ matrix.shard }}
          path: blob-report
          retention-days: 14
          if-no-files-found: warn

      - name: Upload normalized run report, traces, and screenshots for this shard
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: run-artifacts-shard-${{ matrix.shard }}
          path: |
            artifacts/playwright/runs/run-reports
            artifacts/playwright/runs/test-results
          retention-days: 14
          if-no-files-found: warn

  e2e-firefox:
    name: "Application E2E on Firefox (shard ${{ matrix.shard }}/2)"
    runs-on: ubuntu-24.04
    # TS-245: a stuck job (a browser install once hung for 2 hours) is stopped after 30 minutes.
    timeout-minutes: 30
    # TS-139: run inside Playwright's official image, pinned to the same version as
    # @playwright/test. Its browsers and every OS library they need are already installed, so the job
    # no longer spends 10-20 minutes on `playwright install --with-deps` downloading ~150 packages
    # from Ubuntu's mirrors whenever those are slow. Keep the tag in step with package.json.
    # --user 1001 is the runner's own uid (Playwright's documented setting for GitHub Actions, so the
    # checked-out workspace stays writable and Firefox doesn't refuse to run as root).
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001 --ipc=host
    # Inside a container job the Postgres service is reached by its service name, not localhost.
    env:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/seatwise_ci?schema=public
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: seatwise_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate ephemeral, non-secret app config for this CI run only
        # TS-200: each value is masked before it's saved, so it never shows in the log even if a
        # later step prints it.
        run: |
          jwt_secret="$(node -e "process.stdout.write(require('crypto').randomBytes(32).toString('hex'))")"
          echo "::add-mask::$jwt_secret"
          echo "JWT_SECRET=$jwt_secret" >> "$GITHUB_ENV"
          encryption_key="$(node -e "process.stdout.write(require('crypto').randomBytes(32).toString('hex'))")"
          echo "::add-mask::$encryption_key"
          echo "ENCRYPTION_KEY=$encryption_key" >> "$GITHUB_ENV"

      - name: Apply database migrations
        run: pnpm --filter @seatwise/db migrate:deploy

      - name: Build the application
        run: pnpm build

      - name: Start the application and wait for it to be ready
        # TS-139: the server's output goes to a file. Started in the background, its stdout is a pipe
        # nobody reads once this step ends; inside a container job that pipe filled after ~20 tests
        # and every log write -- and so every request -- blocked forever.
        run: |
          pnpm --filter @seatwise/web start -p 3000 > "$RUNNER_TEMP/next-server.log" 2>&1 &
          # TS-172: a plain retry loop instead of downloading an unpinned npm package on every run.
          node -e "const end=Date.now()+60000;(async function wait(){try{const r=await fetch('http://localhost:3000');if(r.ok)return;}catch{}if(Date.now()>end){console.error('server did not start');process.exit(1)}setTimeout(wait,1000)})()"

      - name: Run the application E2E suite (this shard, regression selection minus quarantined)
        # Same selection mechanism as the chromium e2e job -- see that job's own step comment for
        # the full rationale on why this bypasses pw:run directly.
        env:
          CI: "true"
        run: |
          SELECTION_OUTPUT="$(pnpm exec tsx playwright-framework/cli/print-ci-selection.ts regression)"
          PATTERN="$(echo "$SELECTION_OUTPUT" | sed -n '1p')"
          FILES="$(echo "$SELECTION_OUTPUT" | sed -n '2p')"
          pnpm exec playwright test --project=firefox --grep "$PATTERN" $FILES \
            --shard=${{ matrix.shard }}/2 \
            --reporter=blob,./playwright-framework/reporting/normalizedReporter.ts

      - name: Show the end of the app server's log
        if: always()
        run: tail -n 200 "$RUNNER_TEMP/next-server.log" || true

      - name: CI status gate -- fail on a zero-test shard, surface flaky/quarantined results
        if: always()
        # TS-176: a test that only passed on its retry fails the check (it's shown, not hidden).
        env:
          FAIL_ON_FLAKY: "1"
        run: pnpm exec tsx playwright-framework/cli/ci-summary.ts

      - name: Upload blob report (for merging into one combined HTML report)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-report-firefox-shard-${{ matrix.shard }}
          path: blob-report
          retention-days: 14
          if-no-files-found: warn

      - name: Upload normalized run report, traces, and screenshots for this shard
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: run-artifacts-firefox-shard-${{ matrix.shard }}
          path: |
            artifacts/playwright/runs/run-reports
            artifacts/playwright/runs/test-results
          retention-days: 14
          if-no-files-found: warn

  e2e-webkit:
    name: "Application E2E on WebKit (shard ${{ matrix.shard }}/2)"
    runs-on: ubuntu-24.04
    # TS-245: a stuck job (a browser install once hung for 2 hours) is stopped after 30 minutes.
    timeout-minutes: 30
    # TS-139: run inside Playwright's official image, pinned to the same version as
    # @playwright/test. Its browsers and every OS library they need are already installed, so the job
    # no longer spends 10-20 minutes on `playwright install --with-deps` downloading ~150 packages
    # from Ubuntu's mirrors whenever those are slow. Keep the tag in step with package.json.
    # --user 1001 is the runner's own uid (Playwright's documented setting for GitHub Actions, so the
    # checked-out workspace stays writable and Firefox doesn't refuse to run as root).
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001 --ipc=host
    # Inside a container job the Postgres service is reached by its service name, not localhost.
    env:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/seatwise_ci?schema=public
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: seatwise_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate ephemeral, non-secret app config for this CI run only
        # TS-200: each value is masked before it's saved, so it never shows in the log even if a
        # later step prints it.
        run: |
          jwt_secret="$(node -e "process.stdout.write(require('crypto').randomBytes(32).toString('hex'))")"
          echo "::add-mask::$jwt_secret"
          echo "JWT_SECRET=$jwt_secret" >> "$GITHUB_ENV"
          encryption_key="$(node -e "process.stdout.write(require('crypto').randomBytes(32).toString('hex'))")"
          echo "::add-mask::$encryption_key"
          echo "ENCRYPTION_KEY=$encryption_key" >> "$GITHUB_ENV"

      - name: Apply database migrations
        run: pnpm --filter @seatwise/db migrate:deploy

      - name: Build the application
        run: pnpm build

      - name: Start the application and wait for it to be ready
        # TS-139: the server's output goes to a file. Started in the background, its stdout is a pipe
        # nobody reads once this step ends; inside a container job that pipe filled after ~20 tests
        # and every log write -- and so every request -- blocked forever.
        run: |
          pnpm --filter @seatwise/web start -p 3000 > "$RUNNER_TEMP/next-server.log" 2>&1 &
          # TS-172: a plain retry loop instead of downloading an unpinned npm package on every run.
          node -e "const end=Date.now()+60000;(async function wait(){try{const r=await fetch('http://localhost:3000');if(r.ok)return;}catch{}if(Date.now()>end){console.error('server did not start');process.exit(1)}setTimeout(wait,1000)})()"

      - name: Run the application E2E suite (this shard, regression selection minus quarantined)
        # Same selection mechanism as the chromium/firefox e2e jobs -- see e2e's own step comment
        # for the full rationale.
        env:
          CI: "true"
        run: |
          SELECTION_OUTPUT="$(pnpm exec tsx playwright-framework/cli/print-ci-selection.ts regression)"
          PATTERN="$(echo "$SELECTION_OUTPUT" | sed -n '1p')"
          FILES="$(echo "$SELECTION_OUTPUT" | sed -n '2p')"
          pnpm exec playwright test --project=webkit --grep "$PATTERN" $FILES \
            --shard=${{ matrix.shard }}/2 \
            --reporter=blob,./playwright-framework/reporting/normalizedReporter.ts

      - name: Show the end of the app server's log
        if: always()
        run: tail -n 200 "$RUNNER_TEMP/next-server.log" || true

      - name: CI status gate -- fail on a zero-test shard, surface flaky/quarantined results
        if: always()
        # TS-176: a test that only passed on its retry fails the check (it's shown, not hidden).
        env:
          FAIL_ON_FLAKY: "1"
        run: pnpm exec tsx playwright-framework/cli/ci-summary.ts

      - name: Upload blob report (for merging into one combined HTML report)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-report-webkit-shard-${{ matrix.shard }}
          path: blob-report
          retention-days: 14
          if-no-files-found: warn

      - name: Upload normalized run report, traces, and screenshots for this shard
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: run-artifacts-webkit-shard-${{ matrix.shard }}
          path: |
            artifacts/playwright/runs/run-reports
            artifacts/playwright/runs/test-results
          retention-days: 14
          if-no-files-found: warn

  e2e-edge:
    name: "Application E2E on Edge (shard ${{ matrix.shard }}/2)"
    runs-on: ubuntu-24.04
    # TS-245: a stuck job (a browser install once hung for 2 hours) is stopped after 30 minutes.
    timeout-minutes: 30
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: seatwise_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright's Edge channel (with OS deps)
        # ubuntu-24.04 ships Edge preinstalled; this registers the channel with Playwright and
        # satisfies any OS deps rather than downloading a new browser binary, so it's noticeably
        # faster than the Firefox/WebKit equivalents (see TS-63's own spike findings).
        # TS-245: this install once hung for 2 hours -- give up after 10 minutes instead.
        timeout-minutes: 10
        run: pnpm exec playwright install --with-deps msedge

      - name: Generate ephemeral, non-secret app config for this CI run only
        # TS-200: each value is masked before it's saved, so it never shows in the log even if a
        # later step prints it.
        run: |
          jwt_secret="$(node -e "process.stdout.write(require('crypto').randomBytes(32).toString('hex'))")"
          echo "::add-mask::$jwt_secret"
          echo "JWT_SECRET=$jwt_secret" >> "$GITHUB_ENV"
          encryption_key="$(node -e "process.stdout.write(require('crypto').randomBytes(32).toString('hex'))")"
          echo "::add-mask::$encryption_key"
          echo "ENCRYPTION_KEY=$encryption_key" >> "$GITHUB_ENV"

      - name: Apply database migrations
        run: pnpm --filter @seatwise/db migrate:deploy

      - name: Build the application
        run: pnpm build

      - name: Start the application and wait for it to be ready
        # TS-139: the server's output goes to a file. Started in the background, its stdout is a pipe
        # nobody reads once this step ends; inside a container job that pipe filled after ~20 tests
        # and every log write -- and so every request -- blocked forever.
        run: |
          pnpm --filter @seatwise/web start -p 3000 > "$RUNNER_TEMP/next-server.log" 2>&1 &
          # TS-172: a plain retry loop instead of downloading an unpinned npm package on every run.
          node -e "const end=Date.now()+60000;(async function wait(){try{const r=await fetch('http://localhost:3000');if(r.ok)return;}catch{}if(Date.now()>end){console.error('server did not start');process.exit(1)}setTimeout(wait,1000)})()"

      - name: Run the application E2E suite (this shard, regression selection minus quarantined)
        # Same selection mechanism as the other e2e jobs -- see e2e's own step comment for the full
        # rationale.
        env:
          CI: "true"
        run: |
          SELECTION_OUTPUT="$(pnpm exec tsx playwright-framework/cli/print-ci-selection.ts regression)"
          PATTERN="$(echo "$SELECTION_OUTPUT" | sed -n '1p')"
          FILES="$(echo "$SELECTION_OUTPUT" | sed -n '2p')"
          pnpm exec playwright test --project=edge --grep "$PATTERN" $FILES \
            --shard=${{ matrix.shard }}/2 \
            --reporter=blob,./playwright-framework/reporting/normalizedReporter.ts

      - name: Show the end of the app server's log
        if: always()
        run: tail -n 200 "$RUNNER_TEMP/next-server.log" || true

      - name: CI status gate -- fail on a zero-test shard, surface flaky/quarantined results
        if: always()
        # TS-176: a test that only passed on its retry fails the check (it's shown, not hidden).
        env:
          FAIL_ON_FLAKY: "1"
        run: pnpm exec tsx playwright-framework/cli/ci-summary.ts

      - name: Upload blob report (for merging into one combined HTML report)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-report-edge-shard-${{ matrix.shard }}
          path: blob-report
          retention-days: 14
          if-no-files-found: warn

      - name: Upload normalized run report, traces, and screenshots for this shard
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: run-artifacts-edge-shard-${{ matrix.shard }}
          path: |
            artifacts/playwright/runs/run-reports
            artifacts/playwright/runs/test-results
          retention-days: 14
          if-no-files-found: warn

  merge-reports:
    name: Merge sharded HTML report
    # Still runs when shards fail (that's when the combined report matters most), but not when the
    # whole run was cancelled -- e.g. superseded by a newer push via the concurrency group above.
    # Under always() it ran anyway, found no blob reports, and posted a misleading red failure on
    # a run whose real jobs were only cancelled.
    if: ${{ !cancelled() }}
    needs: [e2e, e2e-firefox, e2e-webkit, e2e-edge]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download every shard's blob report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blob-report-shard-*
          path: all-blob-reports
          merge-multiple: true

      - name: Download every shard's blob report (Firefox)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blob-report-firefox-shard-*
          path: all-blob-reports
          merge-multiple: true

      - name: Download every shard's blob report (WebKit)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blob-report-webkit-shard-*
          path: all-blob-reports
          merge-multiple: true

      - name: Download every shard's blob report (Edge)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blob-report-edge-shard-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge into one combined native HTML report
        env:
          PLAYWRIGHT_HTML_REPORT: merged-html-report
        # TS-139: shards ran in two different checkout paths (container vs runner); the merge config
        # gives them a shared testDir.
        run: pnpm exec playwright merge-reports --config=playwright.merge.config.ts --reporter=html ./all-blob-reports

      - name: Upload the merged report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: merged-html-report
          path: merged-html-report
          retention-days: 14
          if-no-files-found: warn
