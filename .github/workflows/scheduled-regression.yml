# Stage 10 -- nightly regression re-confirmation, independent of any push/PR activity. Runs the
# exact same regression selection as the PR gate (.github/workflows/ci.yml), on a schedule, so a
# regression is caught even on a day nobody opens a PR (a flaky-looking failure that only reproduces
# under certain timing, an environment drift, a dependency update via Dependabot landing quietly).
#
# This now re-runs the full application regression suite authored under TS-35 (20 requirement
# stories, 119 application tests as of TS-55) -- no longer the placeholder 2-test set this
# comment originally disclosed. This workflow's separation from the PR gate becomes meaningful on
# its own terms now that @suite:smoke / @suite:regression selections actually differ in size.
name: Nightly regression

# TS-56: schedule trigger RE-ENABLED. It was paused during TS-35 (writing the real automated test
# suite) because, with only a couple of real application tests in place, this was failing nightly
# and paging Tom's inbox with no actionable signal. TS-35 is now Done (20/20 requirement stories,
# 473 tests total including the framework's own unit tests), so a nightly run is meaningful again.
# workflow_dispatch is left in place so it can still be run manually on demand too.
on:
  schedule:
    # 09:00 UTC daily -- an arbitrary but fixed off-peak time; adjust to the team's own timezone
    # preference in a follow-up PR rather than guessing one here.
    - cron: "0 9 * * *"
  workflow_dispatch: {}

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/seatwise_ci?schema=public

jobs:
  regression:
    name: Full regression suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: seatwise_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Generate ephemeral, non-secret app config for this CI run only
        run: |
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "ENCRYPTION_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: pnpm --filter @seatwise/db migrate:deploy
      - run: pnpm build
      - name: Start the application and wait for it to be ready
        run: |
          pnpm --filter @seatwise/web start -p 3000 &
          npx --yes wait-on http://localhost:3000 --timeout 60000
      - name: Run the full regression selection
        env:
          CI: "true"
        run: |
          SELECTION_OUTPUT="$(pnpm exec tsx playwright-framework/cli/print-ci-selection.ts regression)"
          PATTERN="$(echo "$SELECTION_OUTPUT" | sed -n '1p')"
          FILES="$(echo "$SELECTION_OUTPUT" | sed -n '2p')"
          pnpm exec playwright test --project=chromium --grep "$PATTERN" $FILES \
            --reporter=list,html,./playwright-framework/reporting/normalizedReporter.ts
      - name: CI status gate -- fail on a zero-test run, surface flaky/quarantined results
        if: always()
        run: pnpm exec tsx playwright-framework/cli/ci-summary.ts
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-regression-report
          path: |
            artifacts/playwright/runs/html-report
            artifacts/playwright/runs/run-reports
            artifacts/playwright/runs/test-results
          retention-days: 14
          if-no-files-found: warn
